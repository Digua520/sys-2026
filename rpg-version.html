<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="2026届毕业生社会化全景诊断系统·RPG副本版 - 像素风生存路书生成器">
<meta name="robots" content="noindex, nofollow">
<title>⚔ 2026届·社会化全景诊断 RPG副本版</title>

<!-- Pixel Font: Press Start 2P for English UI chrome only -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
/* ============================================================
   CSS VARIABLES — 8-bit Retro Palette
   ============================================================ */
:root {
  --bg-deep:    #080812;
  --bg-panel:   #111128;
  --bg-card:    #181830;
  --border-dim: #2e2e55;
  --border-lit: #5555aa;
  --border-hi:  #8888ff;
  --text-main:  #e0ddf0;
  --text-dim:   #9d9cc0;
  --text-muted: #6e6d90;
  --crt-green:  #33ff66;
  --crt-blue:   #00ddff;
  --crt-gold:   #ffd740;
  --crt-red:    #ff5566;
  --crt-pink:   #ff77bb;
  --hp-green:   #33ee66;
  --mp-blue:    #44aaff;
  --str-orange: #ffaa44;
  --bar-empty:  #1a1a38;

  /* Pixel font — ONLY for English decorative text at legible sizes */
  --font-pixel: 'Press Start 2P', 'Courier New', monospace;
  /* UI font — crisp Chinese-readable font for buttons, labels, tabs */
  --font-ui:    'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
  /* Body font — for long-form Chinese text */
  --font-body:  'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
  /* Mono font — for numbers, codes, stats */
  --font-mono:  'SF Mono', 'Cascadia Code', 'Consolas', 'Courier New', monospace;

  --px: 3px;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 15px;
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text-main);
  min-height: 100vh;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  position: relative;
}

/* ============================================================
   CRT & SCANLINE OVERLAY
   ============================================================ */
.scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px,
    transparent 1px, transparent 4px
  );
}
.crt-vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 9998;
  background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.35) 100%);
}
.crt-flicker {
  position: fixed; inset: 0; pointer-events: none; z-index: 9997;
  background: transparent;
  animation: crtFlicker 8s infinite;
}
@keyframes crtFlicker {
  0%, 100% { background: transparent; }
  0.5% { background: rgba(255,255,255,0.03); }
  1% { background: transparent; }
  50.5% { background: rgba(255,255,255,0.02); }
  51% { background: transparent; }
}

/* ============================================================
   PIXEL BORDER SYSTEM
   ============================================================ */
.pixel-box {
  border: var(--px) solid;
  border-top-color: var(--border-lit);
  border-left-color: var(--border-lit);
  border-right-color: var(--border-dim);
  border-bottom-color: var(--border-dim);
  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,0.05),
    inset -1px -1px 0 rgba(0,0,0,0.3),
    0 0 0 1px rgba(0,0,0,0.5);
  background: var(--bg-panel);
}

.pixel-box-gold {
  border-top-color: #cc9900;
  border-left-color: #cc9900;
  border-right-color: #664400;
  border-bottom-color: #664400;
  box-shadow:
    inset 1px 1px 0 rgba(255,220,80,0.15),
    inset -1px -1px 0 rgba(0,0,0,0.4),
    0 0 8px rgba(255,200,0,0.1);
}

.pixel-box-red {
  border-top-color: #cc3344;
  border-left-color: #cc3344;
  border-right-color: #661122;
  border-bottom-color: #661122;
  box-shadow:
    inset 1px 1px 0 rgba(255,80,80,0.1),
    inset -1px -1px 0 rgba(0,0,0,0.4),
    0 0 8px rgba(255,50,50,0.08);
}

.pixel-box-green {
  border-top-color: #33aa44;
  border-left-color: #33aa44;
  border-right-color: #115522;
  border-bottom-color: #115522;
  box-shadow:
    inset 1px 1px 0 rgba(100,255,100,0.1),
    inset -1px -1px 0 rgba(0,0,0,0.4),
    0 0 8px rgba(50,255,100,0.08);
}

/* ============================================================
   PIXEL BUTTON
   ============================================================ */
.pixel-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--font-ui); font-size: 0.8rem; font-weight: 700;
  padding: 10px 20px; cursor: pointer;
  letter-spacing: 0.04em;
  border: var(--px) solid;
  border-top-color: var(--border-lit);
  border-left-color: var(--border-lit);
  border-right-color: var(--border-dim);
  border-bottom-color: var(--border-dim);
  background: var(--bg-card);
  color: var(--text-main);
  transition: none;
  position: relative;
  user-select: none;
}
.pixel-btn:hover {
  border-top-color: #9b9bff;
  border-left-color: #9b9bff;
  color: #fff;
  background: #202040;
}
.pixel-btn:active {
  border-top-color: var(--border-dim);
  border-left-color: var(--border-dim);
  border-right-color: var(--border-lit);
  border-bottom-color: var(--border-lit);
  transform: translateY(1px);
}
.pixel-btn.btn-primary {
  background: #2a2a80; color: var(--crt-blue);
  border-top-color: #5555cc; border-left-color: #5555cc;
  border-right-color: #1a1a55; border-bottom-color: #1a1a55;
  box-shadow: 0 0 12px rgba(0,180,255,0.2);
}
.pixel-btn.btn-primary:hover {
  background: #3333aa; color: #fff;
  box-shadow: 0 0 20px rgba(0,200,255,0.35);
}
.pixel-btn.btn-gold {
  background: #3a2a00; color: var(--crt-gold);
  border-top-color: #aa8800; border-left-color: #aa8800;
  border-right-color: #553300; border-bottom-color: #553300;
}
.pixel-btn.btn-gold:hover {
  background: #553a00; color: #fff;
  box-shadow: 0 0 16px rgba(255,200,0,0.25);
}
.pixel-btn.btn-danger {
  background: #3a1018; color: var(--crt-red);
  border-top-color: #993344; border-left-color: #993344;
  border-right-color: #551122; border-bottom-color: #551122;
}
.pixel-btn:disabled {
  opacity: 0.35; cursor: not-allowed; pointer-events: none;
}

/* ============================================================
   TITLE SCREEN
   ============================================================ */
.title-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 2rem; text-align: center;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(0,180,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(255,50,100,0.04) 0%, transparent 50%),
    var(--bg-deep);
}
.title-logo {
  font-family: var(--font-pixel); font-size: 1.7rem; line-height: 1.7;
  color: var(--crt-blue); margin-bottom: 0.5rem;
  text-shadow: 0 0 20px rgba(0,220,255,0.5), 0 0 40px rgba(0,220,255,0.2);
  letter-spacing: 0.06em;
}
.title-sub {
  font-family: var(--font-ui); font-size: 0.85rem; font-weight: 700;
  color: var(--crt-gold); margin-bottom: 2rem;
  letter-spacing: 0.1em;
  text-shadow: 0 0 8px rgba(255,200,0,0.3);
}
.title-decor {
  font-size: 0.9rem; color: var(--text-dim); margin-bottom: 2rem;
  letter-spacing: 0.2em;
  font-family: var(--font-mono);
}
.start-btn {
  font-family: var(--font-pixel); font-size: 0.75rem;
  padding: 14px 36px;
  background: transparent;
  color: var(--crt-green);
  border: 3px solid var(--crt-green);
  cursor: pointer;
  letter-spacing: 0.1em;
  animation: blinkText 1.2s steps(1) infinite;
  box-shadow: 0 0 16px rgba(50,255,100,0.25);
  position: relative;
}
.start-btn:hover {
  animation: none;
  background: rgba(50,255,100,0.1);
  box-shadow: 0 0 28px rgba(50,255,100,0.4);
  color: #fff;
}
@keyframes blinkText {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.15; }
}
.title-footer {
  margin-top: 3rem; font-size: 0.7rem; color: var(--text-muted);
  font-family: var(--font-ui); letter-spacing: 0.04em;
}
.title-stars {
  position: absolute; pointer-events: none;
  font-family: var(--font-mono); font-size: 0.6rem;
  color: rgba(255,255,255,0.12);
}

/* ============================================================
   QUESTION SCREEN
   ============================================================ */
.question-screen {
  max-width: 680px; margin: 0 auto; padding: 1rem 1rem 4rem;
}

/* Progress */
.pixel-progress {
  display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem;
}
.progress-track {
  flex: 1; height: 10px; background: var(--bar-empty);
  border: 2px solid var(--border-dim);
  position: relative; overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: repeating-linear-gradient(90deg, var(--crt-green) 0px, var(--crt-green) 8px, #1a5530 8px, #1a5530 10px);
  transition: width 0.3s steps(10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
}
.progress-label {
  font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dim);
  white-space: nowrap;
}

/* RPG Dialog Box */
.rpg-dialog {
  position: relative; padding: 1.5rem;
  margin-bottom: 1.5rem;
}
.dialog-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;
}
.dialog-badge {
  font-family: var(--font-pixel); font-size: 0.55rem;
  padding: 4px 10px;
  border: 2px solid var(--crt-blue);
  color: var(--crt-blue);
  background: rgba(0,200,255,0.08);
  letter-spacing: 0.04em;
  text-shadow: 0 0 6px rgba(0,200,255,0.3);
}
.dialog-badge.boss {
  border-color: var(--crt-red); color: var(--crt-red);
  background: rgba(255,60,60,0.08);
  animation: badgePulse 2s infinite;
}
@keyframes badgePulse {
  0%,100% { box-shadow: 0 0 4px rgba(255,50,50,0.2); }
  50% { box-shadow: 0 0 12px rgba(255,50,50,0.5); }
}
.dialog-title {
  font-family: var(--font-ui); font-size: 0.95rem; font-weight: 700;
  color: var(--text-main); line-height: 1.5;
}
.dialog-scenario {
  position: relative;
  padding: 1rem 1.3rem;
  background: rgba(0,0,0,0.35);
  border-left: 3px solid var(--border-lit);
  margin-bottom: 0.75rem;
  font-size: 0.9rem; line-height: 1.9; color: var(--text-dim);
}
.dialog-scenario .cursor-blink {
  display: inline-block; width: 8px; height: 14px; background: var(--crt-green);
  vertical-align: middle; margin-left: 2px;
  animation: blinkText 0.7s steps(1) infinite;
}
.dialog-pointer {
  font-family: var(--font-pixel); font-size: 0.7rem; color: var(--crt-green);
  animation: blinkText 0.9s steps(1) infinite;
}
.system-note-rpg {
  padding: 0.8rem 1.1rem;
  background: rgba(255,200,0,0.04);
  border: 1px solid rgba(255,200,0,0.2);
  font-size: 0.82rem; color: #c0a860;
  line-height: 1.8;
}
.system-note-rpg::before {
  content: '💡 系统点拨';
  display: block;
  font-family: var(--font-ui); font-size: 0.65rem; font-weight: 700;
  color: var(--crt-gold); margin-bottom: 0.4rem;
  letter-spacing: 0.04em;
}

/* RPG Battle Command Options */
.rpg-commands {
  display: flex; flex-direction: column; gap: 10px;
}
.rpg-command {
  display: flex; align-items: stretch; gap: 0;
  cursor: pointer;
  border: 2px solid var(--border-dim);
  background: var(--bg-card);
  transition: all 0.06s;
  position: relative;
}
.rpg-command:hover {
  border-color: var(--border-lit);
  background: #202040;
}
.rpg-command.selected {
  border-color: var(--crt-blue);
  background: rgba(0,200,255,0.06);
  box-shadow: 0 0 14px rgba(0,200,255,0.12);
}
.rpg-command .cmd-marker {
  flex-shrink: 0; width: 44px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700;
  color: var(--text-dim);
  background: rgba(0,0,0,0.3);
  border-right: 2px solid var(--border-dim);
}
.rpg-command.selected .cmd-marker {
  color: var(--crt-blue);
  background: rgba(0,200,255,0.12);
  border-right-color: var(--crt-blue);
}
.rpg-command .cmd-body { flex: 1; padding: 0.9rem 1.1rem; }
.cmd-label {
  font-weight: 700; font-size: 0.9rem; margin-bottom: 0.25rem;
  color: var(--text-main);
}
.cmd-desc {
  font-size: 0.8rem; color: var(--text-dim); line-height: 1.65;
}
.rpg-command .cmd-selector {
  display: none; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-pixel); font-size: 0.55rem; color: var(--crt-green);
}
.rpg-command.selected .cmd-selector { display: block; }

/* Sub-question label */
.sub-q-label {
  font-family: var(--font-ui); font-size: 0.7rem; font-weight: 700;
  color: var(--crt-gold); margin-bottom: 0.5rem;
  letter-spacing: 0.03em;
}

/* Navigation */
.rpg-nav {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 1.5rem; gap: 0.75rem;
}
.rpg-nav .spacer { flex: 1; }

/* ============================================================
   Q11 SOUL BLANK
   ============================================================ */
.soul-scroll {
  position: relative; padding: 1.5rem;
}
.soul-scroll textarea {
  width: 100%; min-height: 140px; padding: 1rem;
  background: rgba(0,0,0,0.4);
  border: 2px solid var(--border-dim);
  color: var(--crt-gold); font-family: var(--font-body);
  font-size: 0.9rem; line-height: 1.9; resize: vertical;
  outline: none;
}
.soul-scroll textarea:focus {
  border-color: var(--crt-gold);
  box-shadow: 0 0 16px rgba(255,200,0,0.12);
}
.soul-scroll textarea::placeholder { color: var(--text-muted); }
.soul-scroll-footer {
  display: flex; justify-content: space-between; margin-top: 0.5rem;
  font-family: var(--font-ui); font-size: 0.65rem;
  color: var(--text-muted);
}

/* ============================================================
   LOADING SCREEN
   ============================================================ */
.loading-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; text-align: center; padding: 2rem;
}
.loading-spinner {
  width: 64px; height: 64px;
  border: 4px solid var(--border-dim);
  position: relative;
  animation: spinBlock 0.6s steps(4) infinite;
}
@keyframes spinBlock {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.loading-spinner::after {
  content: '';
  position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px;
  border: 4px solid transparent;
  border-top-color: var(--crt-blue);
  border-right-color: var(--crt-blue);
}
.loading-text {
  font-family: var(--font-pixel); font-size: 0.7rem; color: var(--crt-blue);
  margin-top: 1.5rem; letter-spacing: 0.05em;
  text-shadow: 0 0 10px rgba(0,200,255,0.4);
  animation: blinkText 0.8s steps(1) infinite;
}
.loading-sub {
  font-family: var(--font-ui); font-size: 0.7rem; color: var(--text-dim);
  margin-top: 0.5rem;
}

/* ============================================================
   RESULT SCREEN — Character Sheet
   ============================================================ */
.result-screen {
  max-width: 700px; margin: 0 auto; padding: 1rem 1rem 3rem;
}

/* Character Header */
.char-header {
  text-align: center; padding: 1.5rem; margin-bottom: 1.5rem;
}
.char-level {
  font-family: var(--font-pixel); font-size: 0.6rem;
  color: var(--crt-blue); letter-spacing: 0.08em; margin-bottom: 0.5rem;
  text-shadow: 0 0 8px rgba(0,200,255,0.35);
}
.char-name {
  font-family: var(--font-pixel); font-size: 0.9rem;
  color: var(--text-main); line-height: 1.6; margin-bottom: 0.3rem;
}
.char-class {
  font-family: var(--font-ui); font-size: 0.75rem; font-weight: 700;
  color: var(--crt-gold); letter-spacing: 0.05em;
  text-shadow: 0 0 6px rgba(255,200,0,0.3);
}
.char-match {
  display: inline-block; margin-top: 0.5rem;
  font-family: var(--font-pixel); font-size: 0.5rem; padding: 4px 12px;
  letter-spacing: 0.05em;
}
.match-excellent { color: var(--crt-green); border: 2px solid var(--crt-green); text-shadow: 0 0 6px rgba(50,255,100,0.35); }
.match-good { color: var(--crt-gold); border: 2px solid var(--crt-gold); text-shadow: 0 0 6px rgba(255,200,0,0.3); }
.match-ok { color: var(--text-dim); border: 2px solid var(--text-dim); }

/* Stat Sheet */
.stat-sheet { padding: 1.2rem 1.5rem; margin-bottom: 1.5rem; }
.stat-sheet-title {
  font-family: var(--font-pixel); font-size: 0.6rem; color: var(--crt-blue);
  margin-bottom: 1rem; letter-spacing: 0.06em;
  padding-bottom: 0.6rem; text-shadow: 0 0 6px rgba(0,200,255,0.3);
  border-bottom: 2px solid var(--border-dim);
}
.stat-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 0.65rem;
}
.stat-icon {
  font-family: var(--font-mono); font-size: 0.6rem; width: 44px;
  flex-shrink: 0; color: var(--text-dim); font-weight: 700;
}
.stat-bar-wrap {
  flex: 1; height: 16px; background: var(--bar-empty);
  border: 1px solid var(--border-dim); position: relative; overflow: hidden;
}
.stat-bar-fill {
  height: 100%; transition: width 1s steps(20);
  /* Pixel segmentation via repeating gradient */
  background-size: 8px 100%;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.2);
}
.stat-bar-fill.hp { background-image: repeating-linear-gradient(90deg, #44ee66 0px, #44ee66 6px, #228833 6px, #228833 8px); }
.stat-bar-fill.mp { background-image: repeating-linear-gradient(90deg, #44aaff 0px, #44aaff 6px, #225588 6px, #225588 8px); }
.stat-bar-fill.str { background-image: repeating-linear-gradient(90deg, #ff9944 0px, #ff9944 6px, #884422 6px, #884422 8px); }
.stat-bar-fill.def { background-image: repeating-linear-gradient(90deg, #88ccff 0px, #88ccff 6px, #446688 6px, #446688 8px); }
.stat-bar-fill.agi { background-image: repeating-linear-gradient(90deg, #ffdd44 0px, #ffdd44 6px, #887722 6px, #887722 8px); }
.stat-bar-fill.int { background-image: repeating-linear-gradient(90deg, #ff66aa 0px, #ff66aa 6px, #883355 6px, #883355 8px); }
.stat-bar-fill.tec { background-image: repeating-linear-gradient(90deg, #44ddcc 0px, #44ddcc 6px, #226655 6px, #226655 8px); }
.stat-bar-fill.crt { background-image: repeating-linear-gradient(90deg, #ff4444 0px, #ff4444 6px, #882222 6px, #882222 8px); }
.stat-val {
  font-family: var(--font-mono); font-size: 0.6rem; width: 42px;
  text-align: right; color: var(--text-dim); flex-shrink: 0; font-weight: 700;
}

/* RPG Menu Tabs */
.rpg-tabs {
  display: flex; gap: 4px; margin-bottom: 1rem; flex-wrap: wrap;
}
.rpg-tab {
  font-family: var(--font-ui); font-size: 0.7rem; font-weight: 700;
  padding: 8px 14px;
  cursor: pointer; letter-spacing: 0.03em;
  border: 2px solid var(--border-dim); background: var(--bg-card);
  color: var(--text-dim);
}
.rpg-tab:hover { border-color: var(--border-lit); color: var(--text-main); }
.rpg-tab.active {
  border-color: var(--crt-blue); color: var(--crt-blue);
  background: rgba(0,200,255,0.06);
  text-shadow: 0 0 6px rgba(0,200,255,0.3);
}

/* RPG Panel content */
.rpg-panel { padding: 1.2rem 1.5rem; }
.rpg-panel-title {
  font-family: var(--font-pixel); font-size: 0.58rem; color: var(--crt-gold);
  margin-bottom: 0.8rem; letter-spacing: 0.05em;
  text-shadow: 0 0 6px rgba(255,200,0,0.25);
}
.rpg-panel-text {
  font-size: 0.9rem; line-height: 1.95; color: var(--text-dim);
}
.rpg-panel-text strong { color: var(--text-main); }

/* Action list in panel */
.action-list-rpg { display: flex; flex-direction: column; gap: 1rem; }
.action-item-rpg { display: flex; gap: 10px; }
.action-num {
  flex-shrink: 0; width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
  background: rgba(0,200,255,0.1); color: var(--crt-blue);

/** Safe sessionStorage wrapper — never throws in private browsing */
const safeStore = {
  get(key) {
    try { return sessionStorage.getItem(key); } catch { return null; }
  },
  set(key, value) {
    try { sessionStorage.setItem(key, value); return true; } catch { return false; }
  },
  remove(key) {
    try { sessionStorage.removeItem(key); } catch {}
  },
  clear() {
    try { sessionStorage.clear(); } catch {}
  }
};

/** Safe localStorage — for API key persistence */
const safeLocal = {
  get(key) {
    try { return localStorage.getItem(key); } catch { return null; }

  set(key, value) {

  remove(key) {

  }
};

/**
 * fetch with AbortController timeout.
 * Resolves with Response or rejects with 'Request timed out'.
 */
async function fetchWithTimeout(url, options = {}, timeoutMs = 12000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const resp = await fetch(url, { ...options, signal: controller.signal });
    return resp;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error(`Request timed out after ${timeoutMs}ms`);
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

const VECTORS = {
  'q1a': { A:[-2, 0, 0, 1,-1], B:[ 0, 2,-1, 0, 0], C:[ 3, 0, 1, 0, 1] },
  'q1b': { A:[-1,-2, 2, 1, 0], B:[ 2, 0, 1, 2, 1], C:[ 0, 3,-1,-1, 0] },
  'q2':  { A:[-2,-1, 1, 0,-2], B:[ 0, 1,-1, 0, 0], C:[ 2, 1, 1, 0, 3] },
  'q3':  { A:[-1, 0, 0, 0,-3], B:[ 0, 1,-1, 0,-1], C:[ 1, 1, 1, 0, 3] },
  'q4':  { A:[-2,-2, 1, 0,-1], B:[-1, 0,-2, 0,-1], C:[ 3, 1, 2, 1, 1] },
  'q5':  { A:[ 2, 1, 1, 0, 0], B:[-1, 1,-1, 0,-2], C:[ 2, 1, 1, 0, 3] },
  'q6':  { A:[-1, 0,-2,-3,-1], B:[ 0, 1, 0,-1, 0], C:[ 2, 0, 3, 5, 1] },
  'q7':  { A:[ 1, 0, 0, 0, 1], B:[-1, 0,-1, 0,-3], C:[ 2, 0, 1, 1, 2] },
  'q8':  { A:[-1, 1,-3,-1, 0], B:[ 0, 2,-1, 0, 0], C:[ 3, 0, 3, 1, 1] },
  'q9':  { A:[-2, 0,-2, 0,-3], B:[ 0, 0, 1, 0,-2], C:[ 2, 1, 2, 0, 4] },
  'q10': { A:[-2, 0,-3,-1,-1], B:[ 0, 1, 0, 0,-2], C:[ 3, 0, 2, 1, 2] },
};

// Pre-compute theoretical min/max for each dimension from VECTORS.
// Cached at module load — never changes at runtime.
const DIM_KEYS = ['务实','求稳','破局','技术','人情'];
const VECTOR_BOUNDS = (() => {
  const mins = Object.fromEntries(DIM_KEYS.map(k => [k, 0]));
  const maxs = Object.fromEntries(DIM_KEYS.map(k => [k, 0]));
  for (const opts of Object.values(VECTORS)) {
    const vecs = Object.values(opts);
    DIM_KEYS.forEach((d, i) => {
      // Pick the most extreme option for THIS question — not sum all options
      mins[d] += Math.min(...vecs.map(v => v[i]));
      maxs[d] += Math.max(...vecs.map(v => v[i]));
    });
  }
  return { mins, maxs };
})();

function compute5Dims(answers) {
  const raw = Object.fromEntries(DIM_KEYS.map(k => [k, 0]));
  for (const [qid, opts] of Object.entries(VECTORS)) {
    const ans = answers[qid];
    if (!ans || !opts[ans]) continue;
    const v = opts[ans];
    DIM_KEYS.forEach((d, i) => { raw[d] += v[i]; });
  }

  // Normalize to 0–100 using pre-computed dynamic bounds.
  // If a user's score falls outside the theoretical range
  // (e.g. unanswered questions), clamp without hard cut-off.
  const norm = {};
  for (const d of DIM_KEYS) {
    const range = VECTOR_BOUNDS.maxs[d] - VECTOR_BOUNDS.mins[d];
    norm[d] = range > 0
      ? Math.round(Math.max(0, Math.min(100, (raw[d] - VECTOR_BOUNDS.mins[d]) / range * 100)))
      : 50;
  }
  return { raw, norm };
}

// Find ANY profession in matrix — used as last-resort fallback
const FIRST_PROFESSION = Object.values(PROFESSION_MATRIX)
  .flatMap(Object.values)
  .find(p => p?.name) || { name:'冒险者', rpgClass:'未知 系', level:10, desc:'路径还在成型中' };

function determineProfession(dims) {
  // Sort dimensions by normalized score, pick top 2
  const sorted = Object.entries(dims.norm).sort((a,b) => b[1] - a[1]);
  const primary   = sorted[0][0];
  const secondary = sorted[1][0];

  // Look up profession. Try exact combo, then swap, then first available.
  const prof = PROFESSION_MATRIX[primary]?.[secondary]
            ?? PROFESSION_MATRIX[secondary]?.[primary]
            ?? FIRST_PROFESSION;

  // Adjust level based on highest dimension score
  const topScore = sorted[0][1];
  const adjustedLevel = Math.min(99, prof.level + Math.floor((topScore - 50) / 3));

  return {
    ...prof,
    level: Math.max(10, adjustedLevel),
    primaryDim: primary,
    secondaryDim: secondary,
    topScore,
  };
}

// Resolve a 2-level nested lookup with fallback.
// e.g. pick('trench', `务实_${seg}`, `求稳_${seg}`) → falls back to mid/mid → hardcoded string
const pick2 = (group, k1, k2, fallback) =>
  FRAGMENTS[group]?.[k1]?.[k2] ?? fallback;

const pick1 = (group, key, fallback) =>
  FRAGMENTS[group]?.[key] ?? fallback;

  const 战壕 = pick2('trench', `务实_${s.务实}`, `求稳_${s.求稳}`, DEFAULTS.trench);

  }
  if (answers['q2'] === 'C') {

  return { 生存战壕:战壕, 反杀手段, 情感防弹衣, 热血定调 };
}

/* == MAIN ENTRY: generateRoadmap ========================= */
function generateRoadmap(answers) {
  const dims = compute5Dims(answers);
  const profession = determineProfession(dims);
  const report = assembleReport(dims, profession, answers);

  // Determine match quality based on how concentrated the top scores are
  const scores = Object.values(dims.norm);
  const top2 = scores.sort((a,b) => b-a).slice(0,2);
  const concentration = (top2[0] - top2[1]); // gap between top 2
  const matchQuality = concentration > 18 ? 'high' : concentration > 8 ? 'medium' : 'low';

  return {
    professionName: profession.name,
    rpgClass: profession.rpgClass,
    rpgLevel: profession.level,
    primaryDim: profession.primaryDim,
    secondaryDim: profession.secondaryDim,
    matchQuality,
    dimensions: dims.norm,       // 0-100 normalized
    rawScores: dims.raw,         // raw scores for debugging
    生存战壕: report.生存战壕,
    反杀手段: report.反杀手段,
    情感防弹衣: report.情感防弹衣,
    热血定调: report.热血定调,
    generatedAt: new Date().toISOString(),
    answerProfile: answers,
  };
}

        headers:{'Content-Type':'application/json','Authorization':`Bearer ${this.config.apiKey}`},

          ],
          max_tokens:this.config.maxTokens, temperature:this.config.temperature, stream:false
        })
      }, 15000); // 15s timeout
      if (!resp.ok) { const err = await resp.json().catch(()=>({})); throw new Error(err.error?.message||`API请求失败: ${resp.status}`); }
      const data = await resp.json();
      return data.choices?.[0]?.message?.content || null;
    } catch(e) { console.warn('DeepSeek API失败:', e.message); throw e; }
  },

  /** Streaming version — calls onChunk as tokens arrive. Returns full text via onComplete. */
  async generateQ11ResponseStream(text, profile, onChunk, onComplete, onError) {
    if (!this.config.enabled) { onComplete?.(null); return; }
    try {
      const resp = await fetchWithTimeout(`${this.config.apiBase}/chat/completions`, {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${this.config.apiKey}`},
        body: JSON.stringify({
          model:this.config.model, messages:[
            {role:'system',content:this.buildSystemPrompt(profile)},
            {role:'user',content:text||'（这位同学什么都没写，但选择留白本身也是一种表达。）'}
          ],
          max_tokens:this.config.maxTokens, temperature:this.config.temperature, stream:true
        })
      }, 15000);

      if (!resp.ok) {
        const err = await resp.json().catch(()=>({}));
        throw new Error(err.error?.message||`API请求失败: ${resp.status}`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
        for (const line of lines) {
          const payload = line.slice(6).trim();
          if (payload === '[DONE]') continue;
          try {
            const parsed = JSON.parse(payload);
            const content = parsed.choices?.[0]?.delta?.content || '';
            if (content) { fullText += content; onChunk?.(content, fullText); }
          } catch { /* skip unparseable chunks */ }
        }
      }
      onComplete?.(fullText);
    } catch (e) {
      console.warn('DeepSeek streaming failed:', e.message);
      onError?.(e);
    }
  }
};

    '技术': `你选了这个时代最性感的武器——把AI当成你的杠杆。${hasEmotion ? '你对技术变革的焦虑不是软弱，是敏锐。但请把焦虑转化成学习的动力——花一周时间精通一个大模型工具，你的信心会完全不同。' : ''}${hasAction ? '你提到的方向很好——现在需要的是做一个具体的小作品。哪怕只是一个用AI做的数据分析报告。一线城市的老板不吃情怀，只吃成果。' : '明天，用AI做一个具体的作品。任何作品。一个landing page、一份行业分析、一套文案模板。面试的时候直接打开电脑给人看——这个动作会让你在95%的竞争者中脱颖而出。'}你的职业是"${professionName}"——AI不会淘汰你，先学会用AI的同龄人才会。你已经在正确的方向上了。`,

    '人情': `你懂得了一个被大多数人低估的真理——<strong>看懂规则的人，永远不会输。</strong>${hasEmotion ? '你对人际关系的敏感不是弱点，是你最被低估的武器。会读空气、懂边界、知进退——这些是任何AI都替代不了的能力。' : ''}${hasAction ? '你写下的行动方向很好——现在需要的是在执行中继续保持对人心的洞察。技术能帮你做事，人情能帮你成事。' : '明天，做一件"对人"的事：给一个帮过你的人真诚地道谢，或者给一个消耗你的人设一条清晰的边界。这两件事比任何职场厚黑学都有用。'}你的职业是"${professionName}"——在这个越来越冷冰冰的时代，懂人情的人永远有饭吃。保持这份清醒。`,
  };

  return responses[primaryDim] || responses['务实'];
}

// ============================================================
//  RPG APP CONTROLLER
// ============================================================
const RPGApp = {
  state: {
    screen: 'title',
    currentQuestion: 0,
    answers: {},
    q11Text: '',
    roadmap: null,
    q11AIResponse: null,
    isGenerating: false,
    activeRpgTab: 'trench'
  },

  // ── Init ──
  init() {
    DeepSeekClient.loadApiKey();
    this.bindEvents();
    this.checkHash();
  },

  checkHash() {
    const hash = window.location.hash;
    if (hash === '#result' && safeStore.get('roadmap_rpg')) {
      this.state.roadmap = JSON.parse(safeStore.get('roadmap_rpg'));
      this.state.q11AIResponse = safeStore.get('q11_ai_rpg') || null;
      this.state.answers = JSON.parse(safeStore.get('answers_rpg') || '{}');
      this.state.q11Text = safeStore.get('q11_text_rpg') || '';
      this.state.screen = 'result';
      this.render();
      return;
    }
    this.renderTitle();
  },

  bindEvents() {
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      switch (action) {
        case 'start': this.startGame(); break;
        case 'prev': this.prevQuestion(); break;
        case 'next': this.nextQuestion(); break;
        case 'skip-q11': this.generateResult(); break;
        case 'submit-q11': this.submitQ11(); break;
        case 'restart': this.restart(); break;
        case 'save-api-key': this.saveApiKey(); break;
        case 'toggle-api': this.toggleApiPanel(); break;
        case 'retry-ai': this.retryAI(); break;
        case 'tab-trench': this.switchTab('trench'); break;
        case 'tab-skills': this.switchTab('skills'); break;
        case 'tab-armor': this.switchTab('armor'); break;
        case 'tab-battlecry': this.switchTab('battlecry'); break;
        case 'tab-stats': this.switchTab('stats'); break;
        case 'tab-q11result': this.switchTab('q11result'); break;
      }
    });

    // Option selection
    document.addEventListener('click', (e) => {
      const opt = e.target.closest('[data-option]');
      if (!opt) return;
      const qId = opt.dataset.qId;
      const value = opt.dataset.value;
      this.selectOption(qId, value, opt);
    });

    // Q11 input
    document.addEventListener('input', (e) => {
      if (e.target.id === 'q11-input-rpg') {
        this.state.q11Text = e.target.value;
        this.updateQ11Count();
      }
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (this.state.screen === 'title' && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault(); this.startGame(); return;
      }
      if (this.state.screen !== 'questions') return;
      if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
        if (this.hasCurrentAnswer()) { e.preventDefault(); this.nextQuestion(); }
      }
    });
  },

  // ── Render ──
  render() {
    switch (this.state.screen) {
      case 'title': this.renderTitle(); break;
      case 'questions': this.renderQuestion(); break;
      case 'loading': this.renderLoading(); break;
      case 'result': this.renderResult(); break;
    }
  },

  // ── Title Screen ──
  renderTitle() {
    this.state.screen = 'title';
    document.getElementById('app').innerHTML = `
      <div class="title-screen fade-in">
        <div class="title-stars" style="top:10%;left:10%;">✦ ✦ ✦</div>
        <div class="title-stars" style="top:20%;right:15%;">✦ ✦</div>
        <div class="title-stars" style="bottom:25%;left:20%;">✦ ✦ ✦</div>
        <div class="title-stars" style="bottom:15%;right:10%;">✦</div>

        <div class="title-logo">
          2026届毕业生<br>
          社会化全景诊断
        </div>
        <div class="title-sub">⚔ RPG 副本版 ⚔</div>
        <div class="title-decor">━━━━━━━━━━━━━━━━</div>

        <p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:2rem;max-width:480px;line-height:2;">
          这里没有虚伪的AI废话，没有无用的成功学鸡汤。<br>
          <strong style="color:var(--crt-gold);">一场纯匿名、绝不泄露隐私的社会化生存体检。</strong>
        </p>

        <button class="start-btn" data-action="start">
          ▶ PRESS START
        </button>

        <div class="title-footer" style="margin-top:2rem;">
          Ⓒ 2026 SURVIVAL ROADMAP SYSTEM<br>
          <span style="color:var(--text-muted);">10道核心副本 + 1道灵魂留白</span>
        </div>
        <div class="title-footer" style="margin-top:1rem;color:var(--text-muted);">
          [ ENTER 或 点击 开始游戏 ]
        </div>
      </div>
    `;
  },

  // ── Start Game ──
  startGame() {
    this.state.screen = 'questions';
    this.state.currentQuestion = 0;
    this.state.answers = {};
    this.state.q11Text = '';
    this.state.roadmap = null;
    this.state.q11AIResponse = null;
    this.renderQuestion();
    window.scrollTo({ top:0, behavior:'smooth' });
  },

  // ── Question Rendering ──
  getCurrentQuestion() {
    if (this.state.currentQuestion < QUESTIONS.length) return QUESTIONS[this.state.currentQuestion];
    return null;
  },

  hasCurrentAnswer() {
    const q = this.getCurrentQuestion();
    if (!q) return true;
    if (q.subQuestions) return q.subQuestions.every(sq => this.state.answers[sq.id]);
    return !!this.state.answers[`q${q.id}`];
  },

  selectOption(qId, value, element) {
    // Deselect siblings
    const parent = element.closest('.rpg-commands');
    if (parent) parent.querySelectorAll('.rpg-command').forEach(c => c.classList.remove('selected'));
    element.classList.add('selected');
    this.state.answers[qId] = value;
    this.updateNavBtn();
  },

  updateNavBtn() {
    const btn = document.querySelector('[data-action="next"]');
    if (btn) btn.disabled = !this.hasCurrentAnswer();
  },

  renderQuestion() {
    const q = this.getCurrentQuestion();
    if (!q) { this.renderQ11(); return; }

    const totalSteps = QUESTIONS.length;
    const cur = this.state.currentQuestion + 1;
    const progress = (cur / (totalSteps + 1)) * 100;
    const isFirst = this.state.currentQuestion === 0;
    const isLast = this.state.currentQuestion === totalSteps - 1;

    let questionsHtml = '';
    if (q.subQuestions) {
      questionsHtml = q.subQuestions.map(sq => {
        const sel = this.state.answers[sq.id];
        return `
          <div class="sub-q-label">▸ ${sq.text}</div>
          <div class="rpg-commands" style="margin-bottom:1rem;">
            ${sq.options.map(opt => `
              <div class="rpg-command ${sel===opt.value?'selected':''}"
                   data-option data-q-id="${sq.id}" data-value="${opt.value}">
                <span class="cmd-selector">▶</span>
                <div class="cmd-marker">[${opt.value}]</div>
                <div class="cmd-body">
                  <div class="cmd-label">${opt.label}</div>
                  <div class="cmd-desc">${opt.desc}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    } else {
      const qId = `q${q.id}`;
      const sel = this.state.answers[qId];
      questionsHtml = `
        <div class="rpg-commands">
          ${q.options.map(opt => `
            <div class="rpg-command ${sel===opt.value?'selected':''}"
                 data-option data-q-id="${qId}" data-value="${opt.value}">
              <span class="cmd-selector">▶</span>
              <div class="cmd-marker">[${opt.value}]</div>
              <div class="cmd-body">
                <div class="cmd-label">${opt.label}</div>
                <div class="cmd-desc">${opt.desc}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    document.getElementById('app').innerHTML = `
      <div class="question-screen fade-in">
        <div class="pixel-progress">
          <span style="font-family:var(--font-pixel);font-size:0.55rem;color:var(--crt-blue);">Lv.${cur}</span>
          <div class="progress-track">
            <div class="progress-fill" style="width:${progress}%"></div>
          </div>
          <div class="progress-label">${cur}/${totalSteps+1}</div>
        </div>

        <div class="rpg-dialog pixel-box">
          <div class="dialog-header">
            <div class="dialog-badge ${cur>=8?'boss':''}">
              ${cur>=8?'⚠ BOSS STAGE':'QUEST '+cur}
            </div>
            <div class="dialog-title">${q.title}</div>
          </div>
          <div class="dialog-scenario" id="scenario-text">
            ${q.scenario}
          </div>

          ${questionsHtml}

          ${q.note ? `<div class="system-note-rpg">${q.note}</div>` : ''}
        </div>

        <div class="rpg-nav">
          ${!isFirst ? '<button class="pixel-btn" data-action="prev">◀ 上一关</button>' : '<div></div>'}
          <button class="pixel-btn btn-primary" data-action="next" ${this.hasCurrentAnswer()?'':'disabled'}>
            ${isLast ? '⚔ BOSS STAGE ▶' : '下一关 ▶'}
          </button>
        </div>
      </div>
    `;

    window.scrollTo({ top:0, behavior:'smooth' });
  },

  prevQuestion() {
    if (this.state.currentQuestion > 0) {
      this.state.currentQuestion--;
      this.renderQuestion();
    } else {
      this.renderTitle();
    }
  },

  nextQuestion() {
    if (!this.hasCurrentAnswer()) return;
    if (this.state.currentQuestion < QUESTIONS.length - 1) {
      this.state.currentQuestion++;
      this.renderQuestion();
    } else {
      this.state.currentQuestion = QUESTIONS.length;
      this.renderQ11();
    }
  },

  // ── Q11 ──
  renderQ11() {
    const totalSteps = QUESTIONS.length;
    document.getElementById('app').innerHTML = `
      <div class="question-screen fade-in">
        <div class="pixel-progress">
          <span style="font-family:var(--font-pixel);font-size:0.6rem;color:var(--crt-gold);">★</span>
          <div class="progress-track">
            <div class="progress-fill" style="width:100%;background:repeating-linear-gradient(90deg,var(--crt-gold) 0px,var(--crt-gold) 8px,#554400 8px,#554400 10px);"></div>
          </div>
          <div class="progress-label">${totalSteps+1}/${totalSteps+1}</div>
        </div>

        <div class="rpg-dialog pixel-box pixel-box-gold soul-scroll">
          <div class="dialog-header">
            <div class="dialog-badge" style="border-color:var(--crt-gold);color:var(--crt-gold);background:rgba(255,200,0,0.08);">★ SOUL BLANK</div>
            <div class="dialog-title">${Q11.title}</div>
          </div>
          <p style="color:var(--text-dim);margin-bottom:0.75rem;line-height:1.8;">${Q11.scenario}</p>
          <p style="color:var(--crt-gold);margin-bottom:1rem;font-style:italic;font-size:0.85rem;">${Q11.prompt}</p>

          <textarea id="q11-input-rpg" placeholder="${Q11.placeholder}" maxlength="500" rows="6">${this.escapeHtml(this.state.q11Text)}</textarea>

          <div class="soul-scroll-footer">
            <span id="q11-char-count">${this.state.q11Text.length}/500</span>
            <span>🔒 阅后即焚 · 绝不存储</span>
          </div>
        </div>

        <div class="rpg-nav">
          <button class="pixel-btn" data-action="prev">◀ 上一关</button>
          <div style="display:flex;gap:10px;">
            <button class="pixel-btn" data-action="skip-q11">跳过</button>
            <button class="pixel-btn btn-gold" data-action="submit-q11">✨ 提交 · 生成路书</button>
          </div>
        </div>
      </div>
    `;
    this.updateQ11Count();
    setTimeout(() => { const ta = document.getElementById('q11-input-rpg'); if (ta) ta.focus(); }, 300);
    window.scrollTo({ top:0, behavior:'smooth' });
  },

  updateQ11Count() {
    const el = document.getElementById('q11-char-count');
    if (el) el.textContent = `${this.state.q11Text.length}/500`;
  },

  submitQ11() {
    const ta = document.getElementById('q11-input-rpg');
    this.state.q11Text = ta ? ta.value : '';
    this.generateResult();
  },

  // ── Generate ──
  async generateResult() {
    this.state.isGenerating = true;

    // Phase 1: Compute roadmap (pure, instant)
    const roadmap = generateRoadmap(this.state.answers);
    this.state.roadmap = roadmap;
    safeStore.set('roadmap_rpg', JSON.stringify(roadmap));
    safeStore.set('answers_rpg', JSON.stringify(this.state.answers));
    safeStore.set('q11_text_rpg', this.state.q11Text);

    if (this.state.q11Text.trim()) {
      // Phase 2: AI response — show loading screen with live typewriter
      this.renderLoadingWithAI();

      const profile = {
        answers: this.state.answers,
        professionName: roadmap.professionName,
        rpgClass: roadmap.rpgClass,
        primaryDim: roadmap.primaryDim,
        secondaryDim: roadmap.secondaryDim,
        dimensions: roadmap.dimensions,
      };

      // Try DeepSeek streaming first, fallback to local
      await new Promise(resolve => {
        let resolved = false, timeoutId = null;
        const done = () => { if (!resolved) { resolved = true; clearTimeout(timeoutId); resolve(); } };

        if (DeepSeekClient.config.enabled) {
          DeepSeekClient.generateQ11ResponseStream(
            this.state.q11Text, profile,
            // onChunk — typewriter animation
            (chunk, fullText) => this.appendAIText(chunk),
            // onComplete
            (fullText) => {
              if (fullText) {
                this.state.q11AIResponse = fullText;
                safeStore.set('q11_ai_rpg', fullText);
              }
              done();
            },
            // onError — fallback to local
            () => {
              const localR = generateLocalQ11Response(this.state.q11Text, roadmap.professionName, roadmap.primaryDim);
              if (localR) {
                this.state.q11AIResponse = localR;
                safeStore.set('q11_ai_rpg', localR);
              }
              done();
            }
          );
          // Timeout safety: if streaming hangs > 18s, bail
          timeoutId = setTimeout(() => {
            if (!this.state.q11AIResponse) {
              const localR = generateLocalQ11Response(this.state.q11Text, roadmap.professionName, roadmap.primaryDim);
              if (localR) { this.state.q11AIResponse = localR; safeStore.set('q11_ai_rpg', localR); }
            }
            done();
          }, 18000);
        } else {
          const localR = generateLocalQ11Response(this.state.q11Text, roadmap.professionName, roadmap.primaryDim);
          if (localR) { this.state.q11AIResponse = localR; safeStore.set('q11_ai_rpg', localR); }
          // Brief delay so user sees the loading frame
          setTimeout(done, 600);
        }
      });
    }

    this.state.isGenerating = false;
    this.state.screen = 'result';
    this.state.activeRpgTab = 'trench';
    window.location.hash = 'result';
    this.renderResult();
  },

  /** Live-typewriter: appends AI tokens to the loading screen */
  appendAIText(chunk) {
    const el = document.getElementById('ai-live-text');
    if (el) {
      el.textContent += chunk;
      el.scrollTop = el.scrollHeight;
    }
  },

  renderLoading() {
    document.getElementById('app').innerHTML = `
      <div class="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">NOW LOADING...</div>
        <div class="loading-sub">系统正在分析你的答题画像，匹配最佳生存路径</div>
        <div style="margin-top:2rem;font-family:var(--font-mono);font-size:0.6rem;color:var(--text-muted);">
          ████████░░░░░░░░ 50%
        </div>
      </div>
    `;
  },

  /** Loading screen with live AI typewriter area */
  renderLoadingWithAI() {
    document.getElementById('app').innerHTML = `
      <div class="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">⚔ ANALYZING...</div>
        <div class="loading-sub">规则引擎已匹配 · 正在召唤AI老陆回应你的灵魂留白</div>
        <div class="pixel-box" style="margin-top:1.5rem;max-width:540px;width:100%;padding:1rem;text-align:left;min-height:80px;">
          <div style="font-family:var(--font-pixel);font-size:0.45rem;color:var(--crt-gold);margin-bottom:0.5rem;">🤖 AI 正在回应...</div>
          <div id="ai-live-text" style="font-size:0.85rem;line-height:1.9;color:var(--text-dim);white-space:pre-wrap;max-height:300px;overflow-y:auto;"></div>
          <span class="cursor-blink" style="display:inline-block;width:8px;height:14px;background:var(--crt-green);vertical-align:middle;"></span>
        </div>
      </div>
    `;
  },

  // ── Result Screen ──
  renderResult() {
    const rm = this.state.roadmap;
    if (!rm) { this.renderTitle(); return; }

    const lvl = rm.rpgLevel || 20;
    const dims = rm.dimensions;
    const matchCls = rm.matchQuality === 'high' ? 'match-excellent' : rm.matchQuality === 'medium' ? 'match-good' : 'match-ok';
    const matchLabel = rm.matchQuality === 'high' ? 'SSR 极高匹配' : rm.matchQuality === 'medium' ? 'SR 高匹配' : 'R 复合型';

    // Stat bar helper
    const renderStatBar = (label, icon, value, cls) => {
      const pct = Math.round(value); // value is already 0–100 from compute5Dims
      return `
        <div class="stat-row">
          <span class="stat-icon">${icon} ${label}</span>
          <div class="stat-bar-wrap"><div class="stat-bar-fill ${cls}" style="width:${pct}%"></div></div>
          <span class="stat-val">${pct}/100</span>
        </div>
      `;
    };

    // Highlight primary & secondary dimensions
    const isPrimary = (k) => k === rm.primaryDim;
    const isSecondary = (k) => k === rm.secondaryDim;
    const dimLabel = (k) => {
      if (isPrimary(k)) return '★ ';
      if (isSecondary(k)) return '☆ ';
      return '';
    };
    const dimCls = (k) => {
      if (isPrimary(k)) return 'str';
      if (isSecondary(k)) return 'tec';
      return 'def';
    };

    const statBars = `
      ${renderStatBar('STR', `💪${dimLabel('务实')}`, dims.务实, dimCls('务实'))}
      ${renderStatBar('VIT', `🛡️${dimLabel('求稳')}`, dims.求稳, dimCls('求稳'))}
      ${renderStatBar('AGI', `⚡${dimLabel('破局')}`, dims.破局, dimCls('破局'))}
      ${renderStatBar('INT', `🔧${dimLabel('技术')}`, dims.技术, dimCls('技术'))}
      ${renderStatBar('CHA', `💎${dimLabel('人情')}`, dims.人情, dimCls('人情'))}
    `;

    // Build Q11 result section
    let q11ResultHtml = '';
    if (this.state.q11Text.trim()) {
      q11ResultHtml = `
        <div class="pixel-box pixel-box-gold q11-rpg-section" id="tab-q11result" style="display:none;">
          <div class="rpg-panel-title">📜 灵魂卷轴 · 你的留白</div>
          <div class="q11-rpg-quote">
            <p>"${this.escapeHtml(this.state.q11Text)}"</p>
          </div>
          ${this.state.q11AIResponse ? `
            <div class="q11-rpg-ai">
              <div class="ai-badge-rpg">🤖 AI 深度回应 ${DeepSeekClient.config.enabled ? '(DeepSeek)' : '(本地引擎)'}</div>
              <div class="rpg-panel-text">${this.state.q11AIResponse}</div>
              ${DeepSeekClient.config.enabled ? `<p style="margin-top:0.75rem;"><button class="pixel-btn btn-gold" data-action="retry-ai" style="font-size:0.65rem;">🔄 重新生成 AI 回应</button></p>` : ''}
            </div>
          ` : `
            <div style="color:var(--text-muted);line-height:1.8;">
              <p>你的文字已被系统加密存档。有些话不需要回应，写下来本身就已经是释放。</p>
              ${!DeepSeekClient.config.enabled ? `<p style="margin-top:0.5rem;font-size:0.8rem;">💡 提示：配置 <a href="#" data-action="toggle-api" style="color:var(--crt-blue);">DeepSeek API Key</a>（￥0.003/次），可获得针对你的Q11留白的个性化AI深度回应。</p>` : `<p style="margin-top:0.5rem;"><button class="pixel-btn btn-gold" data-action="retry-ai" style="font-size:0.7rem;">🔄 重新请求 AI 回应</button></p>`}
            </div>
          `}
        </div>
      `;
    }

    document.getElementById('app').innerHTML = `
      <div class="result-screen fade-in">
        <!-- Character Header -->
        <div class="pixel-box char-header">
          <div class="char-level">⚔ CHARACTER SHEET ⚔</div>
          <div class="char-name">Lv.${lvl} ${rm.professionName}</div>
          <div class="char-class">${rm.rpgClass} · 主[${rm.primaryDim}] 副[${rm.secondaryDim}]</div>
          <span class="char-match ${matchCls}">${matchLabel}</span>
        </div>

        <!-- RPG Tabs -->
        <div class="rpg-tabs">
          <button class="rpg-tab active" data-action="tab-trench">🏔 战壕</button>
          <button class="rpg-tab" data-action="tab-skills">⚔ 技能</button>
          <button class="rpg-tab" data-action="tab-armor">🛡 防具</button>
          <button class="rpg-tab" data-action="tab-battlecry">🔥 定调</button>
          <button class="rpg-tab" data-action="tab-stats">📊 属性</button>
          ${q11ResultHtml ? '<button class="rpg-tab" data-action="tab-q11result">📜 卷轴</button>' : ''}
        </div>

        <!-- Tab Content: 战壕 -->
        <div class="pixel-box pixel-box-green rpg-panel" id="tab-trench">
          <div class="rpg-panel-title">🏔 生存战壕 · SURVIVAL TRENCH</div>
          <div class="rpg-panel-text">${rm.生存战壕}</div>
        </div>

        <!-- Tab Content: 技能 -->
        <div class="pixel-box rpg-panel" id="tab-skills" style="display:none;">
          <div class="rpg-panel-title">⚔ 反杀技能 · COUNTER SKILLS</div>
          <div class="action-list-rpg">
            ${rm.反杀手段.map((a,i) => `
              <div class="action-item-rpg">
                <div class="action-num">${i+1}</div>
                <div>
                  <div class="action-item-title">${a.title}</div>
                  <div class="action-item-body">${a.body}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Tab Content: 防具 -->
        <div class="pixel-box pixel-box-green rpg-panel" id="tab-armor" style="display:none;">
          <div class="rpg-panel-title">🛡 情感防弹衣 · EMOTIONAL ARMOR</div>
          <div class="rpg-panel-text">${rm.情感防弹衣}</div>
        </div>

        <!-- Tab Content: 定调 -->
        <div class="pixel-box pixel-box-red rpg-panel" id="tab-battlecry" style="display:none;">
          <div class="rpg-panel-title">🔥 热血定调 · BATTLE CRY</div>
          <div class="rpg-panel-text" style="font-size:1rem;">${rm.热血定调}</div>
        </div>

        <!-- Tab Content: 属性 -->
        <div class="pixel-box stat-sheet" id="tab-stats" style="display:none;">
          <div class="stat-sheet-title">📊 角色属性 · ATTRIBUTES</div>
          ${statBars}
          <div style="margin-top:1rem;padding-top:0.6rem;border-top:2px solid var(--border-dim);font-family:var(--font-mono);font-size:0.55rem;color:var(--text-muted);text-align:center;">
            ★主属性 ☆副属性  STR:务实 VIT:求稳 AGI:破局 INT:技术 CHA:人情
          </div>
        </div>

        ${q11ResultHtml}

        <!-- Actions -->
        <div class="result-actions-rpg">
          <button class="pixel-btn" data-action="restart">🔄 重新开始</button>
          <button class="pixel-btn btn-primary" onclick="RPGApp.shareResult()">📤 分享路书</button>
          <button class="pixel-btn" data-action="toggle-api">⚙ API设置</button>
        </div>

        <!-- API Panel -->
        <div class="pixel-box api-panel-rpg" id="api-panel-rpg">
          <div style="font-family:var(--font-pixel);font-size:0.55rem;color:var(--crt-blue);margin-bottom:0.5rem;">⚙ DeepSeek API</div>
          <p style="font-size:0.8rem;color:var(--text-dim);margin-bottom:0.75rem;line-height:1.6;">
            Q11 的 AI 个性化深度回应。API Key 仅保存在你的浏览器中，不上传任何服务器。<br>
            没有 Key？去 <a href="https://platform.deepseek.com" target="_blank" style="color:var(--crt-blue);">platform.deepseek.com</a> 免费注册。<br>
            单次调用成本约 <strong style="color:var(--crt-gold);">￥0.003</strong>（不到半分钱）。
          </p>
          <div style="display:flex;gap:10px;">
            <input type="password" id="api-key-input-rpg" placeholder="输入 DeepSeek API Key (sk-...)" value="${DeepSeekClient.config.apiKey}">
            <button class="pixel-btn btn-primary" data-action="save-api-key">保存</button>
          </div>
          <p style="margin-top:0.5rem;font-size:0.75rem;color:${DeepSeekClient.config.enabled?'var(--crt-green)':'var(--text-muted)'};">
            ${DeepSeekClient.config.enabled ? '✅ API 已配置' : '⚠️ 未配置 API Key，将使用本地引擎回应'}
          </p>
        </div>

        <div style="text-align:center;margin-top:1.5rem;font-family:var(--font-ui);font-size:0.6rem;color:var(--text-muted);">
          Ⓒ 2026 SURVIVAL ROADMAP · RPG EDITION · 纯匿名 · 数据仅存于浏览器
        </div>
      </div>
    `;

    window.scrollTo({ top:0, behavior:'smooth' });
  },

  switchTab(tabId) {
    this.state.activeRpgTab = tabId;
    // Update tab buttons
    document.querySelectorAll('.rpg-tab').forEach(t => t.classList.remove('active'));
    const tabBtn = document.querySelector(`[data-action="tab-${tabId}"]`);
    if (tabBtn) tabBtn.classList.add('active');
    // Show/hide panels
    ['trench','skills','armor','battlecry','stats','q11result'].forEach(id => {
      const panel = document.getElementById(`tab-${id}`);
      if (panel) panel.style.display = id === tabId ? '' : 'none';
    });
  },

  // ── API Management ──
  saveApiKey() {
    const input = document.getElementById('api-key-input-rpg');
    if (!input) return;
    DeepSeekClient.setApiKey(input.value.trim());
    // Re-render — the template checks DeepSeekClient.config.enabled
    // and shows the correct status automatically
    this.renderResult();
  },

  toggleApiPanel() {
    const panel = document.getElementById('api-panel-rpg');
    if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  },

  async retryAI() {
    if (!DeepSeekClient.config.enabled || !this.state.q11Text.trim()) return;
    try {
      this.state.q11AIResponse = null;
      const aiResp = await DeepSeekClient.generateQ11Response(this.state.q11Text, {
        answers: this.state.answers,
        professionName: this.state.roadmap.professionName,
        rpgClass: this.state.roadmap.rpgClass,
        primaryDim: this.state.roadmap.primaryDim,
        secondaryDim: this.state.roadmap.secondaryDim,
        dimensions: this.state.roadmap.dimensions
      });
      if (aiResp) {
        this.state.q11AIResponse = aiResp;
        safeStore.set('q11_ai_rpg', aiResp);
      }
    } catch (e) {
      const localResp = generateLocalQ11Response(this.state.q11Text, this.state.roadmap.professionName, this.state.roadmap.primaryDim);
      if (localResp) { this.state.q11AIResponse = localResp; safeStore.set('q11_ai_rpg', localResp); }
    }
    this.renderResult();
  },

  // ── Share ──
  shareResult() {
    const rm = this.state.roadmap;
    if (!rm) return;
    const stripped = rm.热血定调.replace(/<[^>]+>/g, '');
    const truncated = stripped.length > 180
      ? stripped.substring(0, 180).replace(/\s+$/,'') + '…'
      : stripped;
    const shareText = `【2026届毕业生社会化全景诊断·RPG副本版】
⚔ Lv.${rm.rpgLevel} ${rm.professionName} · ${rm.rpgClass}
主[${rm.primaryDim}] 副[${rm.secondaryDim}]

${truncated}

—— 免费诊断：${window.location.origin}${window.location.pathname}`;

    if (navigator.share) {
      navigator.share({ title:'我的2026届毕业生生存路书', text:shareText }).catch(()=>{});
    } else {
      navigator.clipboard.writeText(shareText).then(()=>{
        const btn = document.querySelector('[onclick="RPGApp.shareResult()"]');
        if (btn) { const orig = btn.textContent; btn.textContent = '✅ 已复制!'; setTimeout(()=>{btn.textContent=orig;},1500); }
      }).catch(()=>{ prompt('复制以下文本分享：', shareText); });
    }
  },

  // ── Restart ──
  restart() {
    safeStore.clear();
    window.location.hash = '';
    this.state = {
      screen: 'title', currentQuestion: 0, answers: {}, q11Text: '',
      roadmap: null, q11AIResponse: null, isGenerating: false,
      activeRpgTab: 'trench'
    };
    this.renderTitle();
    window.scrollTo({ top:0, behavior:'smooth' });
  },

  // ── Utils ──
  escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
};

// ── Boot ──
document.addEventListener('DOMContentLoaded', () => RPGApp.init());
</script>
</body>
</html>
